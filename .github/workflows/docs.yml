name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - hooks.py
      - docs-requirements.txt
      - .github/workflows/docs.yml

# The Pages deployment is the live site, so queue runs instead of cancelling —
# a cancelled deploy would leave the site on an older build.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs-requirements.txt

      # --strict fails the build on broken internal links, so a bad link never
      # reaches the published site.
      - name: Build the site
        run: mkdocs build --strict

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
