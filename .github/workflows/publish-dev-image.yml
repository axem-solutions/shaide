name: Publish dev installer image

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: publish-dev-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer-image:
    name: Build and publish installer image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate installer image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/installer
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build and push installer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./installer/build/Dockerfile
          platforms: linux/amd64
          push: true

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: type=gha,scope=installer-linux-amd64
          cache-to: type=gha,mode=max,scope=installer-linux-amd64
