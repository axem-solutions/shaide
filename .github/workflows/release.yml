name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    name: Create Release
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "version=${BRANCH#release/}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Extract CHANGELOG section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          cat > /tmp/extract_changelog.js <<'NODE_SCRIPT'
          const fs = require('fs');
          const version = process.argv[2];
          const re = new RegExp('^## \\[?' + version.replace(/\./g, '\\.') + '\\]?(\\s|$)');
          const content = fs.existsSync('CHANGELOG.md')
            ? fs.readFileSync('CHANGELOG.md', 'utf-8')
            : '';
          const lines = content.split('\n');
          let inSection = false;
          const out = [];
          for (const line of lines) {
            if (re.test(line)) { inSection = true; continue; }
            if (inSection && line.startsWith('## ')) break;
            if (inSection) out.push(line);
          }
          process.stdout.write(out.join('\n').trim() || 'No changelog available.');
          NODE_SCRIPT
          node /tmp/extract_changelog.js "$VERSION" > /tmp/release_notes.md

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-installer-image:
    name: Build and publish installer image
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate installer image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/installer
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}

      - name: Build and push installer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./installer/build/Dockerfile
          platforms: linux/amd64
          push: true

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: type=gha,scope=installer-linux-amd64
          cache-to: type=gha,mode=max,scope=installer-linux-amd64