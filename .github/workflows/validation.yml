name: Validate Go and docs

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, app_shaide, app_mcp]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go from the module
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            pkg/go.sum
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Test all module packages
        run: go test -count=1 ./...
      - name: Vet all module packages
        run: go vet ./...

  docs:
    name: Strict docs and workflow contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs-requirements.txt
      - name: Check validation contract
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build documentation without publishing
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/docs-site"
