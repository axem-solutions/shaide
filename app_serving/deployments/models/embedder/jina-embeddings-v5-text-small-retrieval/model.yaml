# Jina Embeddings v5 Text Small Retrieval model definition
# Serves jinaai/jina-embeddings-v5-text-small-retrieval through the OpenAI-compatible /v1/embeddings API
# Retrieval-tuned model for RAG. Callers should distinguish query vs document text upstream.

slug: jina-embeddings-v5-text-small-retrieval
revision: "6856e76bb72982e58de0620458a4e8b3614da340"
model:
  name: "jinaai/jina-embeddings-v5-text-small-retrieval"
  size: 10Gi
server:
  replicas: 1
  args:
    - "--runner"
    - "pooling"
    - "--tensor-parallel-size"
    - "1"
    - "--gpu-memory-utilization"
    - "0.8"
    - "--max-model-len"
    - "32768"
    - "--dtype"
    - "bfloat16"
    - "--max-num-seqs"
    - "8"
    - "--max-num-batched-tokens"
    - "32768"
    - "--trust-remote-code"
  env:
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_IGNORE_DISABLED_P2P
      value: "1"
    - name: NCCL_DEBUG
      value: "INFO"
    - name: VLLM_SKIP_P2P_CHECK
      value: "1"
    - name: GLOO_SOCKET_IFNAME
      value: "eth0"
    - name: NCCL_SOCKET_IFNAME
      value: "eth0"
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "16Gi"
      cpu: "8"
    requests:
      nvidia.com/gpu: "1"
      memory: "12Gi"
      cpu: "6"
  volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: torch-compile-cache
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
