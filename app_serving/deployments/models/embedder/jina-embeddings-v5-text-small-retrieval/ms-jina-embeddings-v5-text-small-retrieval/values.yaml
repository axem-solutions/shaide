# Jina Embeddings v5 Text Small Retrieval ModelService Configuration
# Serves jinaai/jina-embeddings-v5-text-small-retrieval through the OpenAI-compatible /v1/embeddings API
# Retrieval-tuned model for RAG. Callers should distinguish query vs document text upstream.
multinode: false

modelArtifacts:
  name: "jinaai/jina-embeddings-v5-text-small-retrieval"
  uri: "hf://jinaai/jina-embeddings-v5-text-small-retrieval"
  size: 10Gi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-jina-embeddings-v5-text-small-retrieval-llm-d-modelservice"

routing:
  servicePort: 8000

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d-cuda:v0.4.0"
    modelCommand: vllmServe
    args:
      - "--runner"
      - "pooling"
      - "--tensor-parallel-size"
      - "1"
      - "--gpu-memory-utilization"
      - "0.8"
      - "--max-model-len"
      - "32768"
      - "--dtype"
      - "bfloat16"
      - "--max-num-seqs"
      - "8"
      - "--max-num-batched-tokens"
      - "32768"
      - "--trust-remote-code"
    env:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: NCCL_P2P_DISABLE
        value: "1"
      - name: NCCL_IGNORE_DISABLED_P2P
        value: "1"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: VLLM_SKIP_P2P_CHECK
        value: "1"
      - name: GLOO_SOCKET_IFNAME
        value: "eth0"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: "16Gi"
        cpu: "8"
      requests:
        nvidia.com/gpu: "1"
        memory: "12Gi"
        cpu: "6"
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

prefill:
  create: false
  replicas: 0
