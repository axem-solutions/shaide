# Embedding simulator for a local cluster: llm-d-inference-sim serves
# /v1/embeddings next to the chat and completions endpoints. No GPU, no
# weights; the image is pulled from ghcr.io. The installer does not offer
# simulated embedders; deploy it with a direct `pulumi up`.
#   source: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0

slug: sim-local-emb
model:
  name: "random/model-2"
  size: 5Mi
server:
  engine: sim
  image: "ghcr.io/llm-d/llm-d-inference-sim:v1.0.0"
  replicas: 1
