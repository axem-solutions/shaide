# Creates the resources for simulating llm-d inference — on-prem / air-gap variant.
# All images are served from internal Harbor; no internet access required on cluster nodes.
#
# Image upload, before pulumi up: copy the image into the Harbor project referenced below.
#   skopeo copy docker://ghcr.io/llm-d/llm-d-inference-sim:v1.0.0 \
#     docker://<harbor-host>/<project>/llm-d-inference-sim:v1.0.0

slug: sim2
model:
  name: "random/model-2"
  size: 5Mi
server:
  engine: sim
  image: "harbor.harbor.svc.cluster.local/shaide/llm-d-inference-sim:v1.0.0"
  replicas: 1
