# Creates the resources for simulating llm-d inference — on-prem / air-gap variant.
# All images are served from internal Harbor; no internet access required on cluster nodes.
#
# Image upload (run on provisioner laptop before pulumi up):
#   skopeo copy docker://ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1 \
#     oci-archive:ansible/artifacts/images/llm-d-routing-sidecar-v0.4.0-rc.1.tar
#   skopeo copy docker://ghcr.io/llm-d/llm-d-inference-sim:v0.7.1 \
#     oci-archive:ansible/artifacts/images/llm-d-inference-sim-v0.7.1.tar
#   ansible-playbook -i inventory-dev harbor_upload.yml
multinode: false

modelArtifacts:
  name: "random/model-2"
  uri: "hf://random"
  size: 5Mi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-sim2-llm-d-modelservice"

routing:
  servicePort: 8000

  proxy:
    # Routing sidecar from Harbor.  source: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    image: harbor.harbor.svc.cluster.local/shaide/llm-d-routing-sidecar:v0.4.0-rc.1
    connector: nixlv2
    secure: false
    zapLogLevel: error

decode:
  create: true
  replicas: 1
  # Pull secret created by the app-serving Pulumi stack (harbor-creds).
  imagePullSecrets:
    - name: harbor-creds
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    # Sim inference image from Harbor.  source: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1
    image: "harbor.harbor.svc.cluster.local/shaide/llm-d-inference-sim:v0.7.1"
    modelCommand: imageDefault
    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
      - containerPort: 5557
        protocol: TCP
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    startupProbe:
      httpGet:
        path: /health
        port: 8200
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  volumes:
  - name: metrics-volume
    emptyDir: {}

prefill:
  create: true
  replicas: 1
  # Pull secret created by the app-serving Pulumi stack (harbor-creds).
  imagePullSecrets:
    - name: harbor-creds
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "harbor.harbor.svc.cluster.local/shaide/llm-d-inference-sim:v0.7.1"
    modelCommand: imageDefault
    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
      - containerPort: 5557
        protocol: TCP
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 2
  volumes:
  - name: metrics-volume
    emptyDir: {}
