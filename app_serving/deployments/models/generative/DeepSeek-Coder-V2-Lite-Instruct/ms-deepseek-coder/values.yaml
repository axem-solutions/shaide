# DeepSeek Coder V2 Lite Instruct ModelService Configuration
# Creates the resources for DeepSeek-Coder-V2-Lite-Instruct
# Optimized for 1x g5.24xlarge node (4x NVIDIA A10G GPUs)
multinode: false

modelArtifacts:
  name: "deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct"
  uri: "hf://deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct"
  size: 30Gi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-deepseek-coder-llm-d-modelservice"

routing:
  servicePort: 8000

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d-cuda:v0.4.0"
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "2"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-model-len"
      - "16384"
      - "--block-size"
      - "16"
      - "--trust-remote-code"
    env:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      # - name: TP_SIZE
      #   value: "2"
      - name: NCCL_P2P_DISABLE
        value: "1"
      - name: NCCL_IGNORE_DISABLED_P2P
        value: "1"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: VLLM_SKIP_P2P_CHECK
        value: "1"
      - name: GLOO_SOCKET_IFNAME
        value: "eth0"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: "2"
        memory: "28Gi"
        cpu: "8"
      requests:
        nvidia.com/gpu: "2"
        memory: "22Gi"
        cpu: "6"
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

prefill:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d-cuda:v0.4.0"
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "2"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-model-len"
      - "16384"
      - "--block-size"
      - "16"
      - "--trust-remote-code"
    env:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
