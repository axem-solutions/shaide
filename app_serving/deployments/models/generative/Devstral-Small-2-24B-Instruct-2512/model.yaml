# Devstral Small 2 24B Instruct 2512 model definition
# Creates the resources for mistralai/Devstral-Small-2-24B-Instruct-2512
# The model ships in FP8 and the upstream vLLM example uses TP=2 for the full
# 256K context window. We start with a conservative single-GPU profile so the
# model stays practical on 1x 48 GB cards.

slug: devstral-small-2-24b-2512
revision: "55c5b41e98c2dbd21b0c8afffc540dcfc9eb5128"
model:
  name: "mistralai/Devstral-Small-2-24B-Instruct-2512"
  size: 60Gi
server:
  replicas: 1
  args:
    - "--tensor-parallel-size"
    - "1"
    - "--gpu-memory-utilization"
    - "0.4"
    - "--max-model-len"
    - "32768"
    - "--max-num-seqs"
    - "2"
    - "--block-size"
    - "16"
    - "--kv-cache-dtype"
    - "fp8"
    - "--trust-remote-code"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "mistral"
  env:
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_IGNORE_DISABLED_P2P
      value: "1"
    - name: NCCL_DEBUG
      value: "INFO"
    - name: VLLM_SKIP_P2P_CHECK
      value: "1"
    - name: GLOO_SOCKET_IFNAME
      value: "eth0"
    - name: NCCL_SOCKET_IFNAME
      value: "eth0"
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "48Gi"
      cpu: "16"
    requests:
      nvidia.com/gpu: "1"
      memory: "48Gi"
      cpu: "16"
  volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: torch-compile-cache
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
