# GLM-4.7-Flash model definition
# Creates the resources for zai-org/GLM-4.7-Flash
# Uses the official TP=4 vLLM serving shape from the model card.

slug: glm-4-7-flash
revision: "7dd20894a642a0aa287e9827cb1a1f7f91386b67"
model:
  name: "zai-org/GLM-4.7-Flash"
  size: 70Gi
server:
  replicas: 1
  args:
    - "--tensor-parallel-size"
    - "1"
    - "--gpu-memory-utilization"
    - "0.49"
    - "--max-model-len"
    - "65536"
    - "--block-size"
    - "16"
    - "--trust-remote-code"
    - "--speculative-config.method"
    - "mtp"
    - "--speculative-config.num_speculative_tokens"
    - "1"
    # vLLM currently exposes GLM-4.7's tool and reasoning parsers under
    # different names: glm47 for tool calls and glm45 for reasoning tokens.
    - "--tool-call-parser"
    - "glm47"
    - "--reasoning-parser"
    - "glm45"
    - "--enable-auto-tool-choice"
  env:
    - name: VLLM_LOGGING_LEVEL
      value: INFO
    - name: NCCL_P2P_DISABLE
      value: "1"
    - name: NCCL_IGNORE_DISABLED_P2P
      value: "1"
    - name: NCCL_DEBUG
      value: "INFO"
    - name: VLLM_SKIP_P2P_CHECK
      value: "1"
    - name: GLOO_SOCKET_IFNAME
      value: "eth0"
    - name: NCCL_SOCKET_IFNAME
      value: "eth0"
  resources:
    limits:
      nvidia.com/gpu: "1"
      memory: "40Gi"
      cpu: "16"
    requests:
      nvidia.com/gpu: "1"
      memory: "40Gi"
      cpu: "16"
  volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
    - name: metrics-volume
      emptyDir: {}
    - name: torch-compile-cache
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
