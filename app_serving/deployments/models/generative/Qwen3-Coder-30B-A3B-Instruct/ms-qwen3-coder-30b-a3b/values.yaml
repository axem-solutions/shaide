# Qwen3-Coder-30B-A3B-Instruct ModelService Configuration
# Creates the resources for Qwen/Qwen3-Coder-30B-A3B-Instruct
# The upstream model card suggests reducing context length when OOM occurs; we
# start with 32K here to keep the BF16 checkpoint practical on a single 96 GB GPU.
multinode: false

modelArtifacts:
  name: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
  uri: "hf://Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
  size: 70Gi
  authSecretName: "llm-d-hf-token"
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-qwen3-coder-30b-a3b-llm-d-modelservice"

routing:
  servicePort: 8000

  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    # Qwen3-Coder's tool-calling flow depends on newer vLLM support and the qwen3_coder parser.
    image: "ghcr.io/llm-d/llm-d-cuda:latest"
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"
      - "--gpu-memory-utilization"
      - "0.48"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-model-len"
      - "32768"
      - "--max-num-seqs"
      - "4"
      - "--max-num-batched-tokens" 
      - "8192"
      - "--block-size"
      - "16"
      - "--trust-remote-code"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
    env:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: NCCL_P2P_DISABLE
        value: "1"
      - name: NCCL_IGNORE_DISABLED_P2P
        value: "1"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: VLLM_SKIP_P2P_CHECK
        value: "1"
      - name: GLOO_SOCKET_IFNAME
        value: "eth0"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: "64Gi"
        cpu: "16"
      requests:
        nvidia.com/gpu: "1"
        memory: "64Gi"
        cpu: "16"
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

prefill:
  create: false
  replicas: 0
