# Simulator: llm-d's vLLM simulator (llm-d-inference-sim) behind the same
# Gateway, router and routes as a real model. It needs no GPU and no weights,
# and answers with generated text, so it tests the serving path on any node.
#
# The image is the stack's simulatorImage: the installer mirrors it to Harbor,
# a direct `pulumi up` defaults to ghcr.io/llm-d/llm-d-inference-sim:v1.0.0.

slug: simulator
model:
  name: "shaide/simulator"
server:
  engine: sim
  replicas: 1
