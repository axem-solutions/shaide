# Gemma 4 31B-IT ModelService Configuration
# Weights loaded from Harbor via ORAS pull job into PVC gemma-4-31b-model.
# modelArtifacts.uri is overridden at deploy time to pvc+hf://gemma-4-31b-model/hub/google/gemma-4-31B
multinode: false

modelArtifacts:
  name: "google/gemma-4-31B"
  uri: "hf://google/gemma-4-31B"
  size: 180Gi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-gemma-4-31b-llm-d-modelservice"

routing:
  servicePort: 8000

  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    # image: "ghcr.io/llm-d/llm-d-cuda:latest"  # requires CUDA 12.9+, incompatible with AKS NVads_A10_v5 (driver 570.x)
    image: "nemethk/llm-d-cuda:cuda-12.8"
    modelCommand: vllmServe
    args:
      - "--tensor-parallel-size"
      - "1"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-model-len"
      - "32768"
      - "--max-num-seqs"
      - "4"
      - "--block-size"
      - "16"
      - "--trust-remote-code"
    env:
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: spawn
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: INFO
      - name: NCCL_P2P_DISABLE
        value: "1"
      - name: NCCL_IGNORE_DISABLED_P2P
        value: "1"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: VLLM_SKIP_P2P_CHECK
        value: "1"
      - name: GLOO_SOCKET_IFNAME
        value: "eth0"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: "1"
        memory: "48Gi"
        cpu: "10" # "16"
      requests:
        nvidia.com/gpu: "1"
        memory: "48Gi"
        cpu: "10" # "16"
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi

prefill:
  create: false
  replicas: 0
