# Creates the resources for simulating llm-d inference — local vind cluster.
# No GPU, no real model weights. Images pulled directly from public
# registries (ghcr.io) — no Harbor mirror needed, unlike the on-prem
# sim-rke2-1/sim-rke2-2 variant this was derived from.
#   source: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
#   source: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1
multinode: false

modelArtifacts:
  name: "random/model-1"
  uri: "hf://random"
  size: 5Mi
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: "ms-sim-local-gen-llm-d-modelservice"

routing:
  servicePort: 8000

  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    connector: nixlv2
    secure: false
    zapLogLevel: error

decode:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
    modelCommand: imageDefault
    ports:
      - containerPort: 8200
        name: metrics
        protocol: TCP
      - containerPort: 5557
        protocol: TCP
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    startupProbe:
      httpGet:
        path: /health
        port: 8200
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  volumes:
  - name: metrics-volume
    emptyDir: {}

prefill:
  create: true
  replicas: 1
  monitoring:
    podmonitor:
      enabled: false
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
    modelCommand: imageDefault
    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
      - containerPort: 5557
        protocol: TCP
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    startupProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 5
      timeoutSeconds: 2
  volumes:
  - name: metrics-volume
    emptyDir: {}
